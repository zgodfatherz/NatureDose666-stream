name: NatureDose666 Live Stream

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Setup FFmpeg
        run: |
          if ! command -v ffmpeg &> /dev/null; then
            curl -fsSL https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz -o ffmpeg.tar.xz
            tar -xf ffmpeg.tar.xz
            sudo mv ffmpeg-*-amd64-static/ffmpeg /usr/local/bin/
            sudo chmod +x /usr/local/bin/ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Download loop.mp4 from Release
        run: |
          curl -fL -o loop.mp4 \
            "https://github.com/${{ github.repository }}/releases/download/v1.0/loop.mp4"
          ls -lh loop.mp4

      - name: Stream loop.mp4 to YouTube Live (5h 30m)
        env:
          YT_STREAM_KEY: ${{ secrets.YT_STREAM_KEY }}
        run: |
          if [ -z "$YT_STREAM_KEY" ]; then
            echo "ERROR: YT_STREAM_KEY secret is empty!"
            exit 1
          fi
          timeout 19800 ffmpeg -re -stream_loop -1 -i loop.mp4 \
            -c:v copy -c:a copy -f flv \
            "rtmp://a.rtmp.youtube.com/live2/${YT_STREAM_KEY}" || [ $? -eq 124 ]
            
