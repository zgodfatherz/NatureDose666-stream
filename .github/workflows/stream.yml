name: NatureDose666 Live Stream

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */5 * * *'

concurrency:
  group: naturedose666-live-stream
  cancel-in-progress: true

jobs:
  stream:
    runs-on: ubuntu-24.04
    steps:
      - name: Setup FFmpeg
        uses: AnimMouse/setup-ffmpeg@v1

      - name: Download loop.mp4 from Release
        run: |
          curl -fL -o loop.mp4 \
            "https://github.com/${{ github.repository }}/releases/download/v1.0/loop.mp4"
          ls -lh loop.mp4

      - name: Stream loop.mp4 to YouTube Live (5h 15m)
        env:
          YT_STREAM_KEY: ${{ secrets.YT_STREAM_KEY }}
        run: |
          if [ -z "$YT_STREAM_KEY" ]; then
            echo "ERROR: YT_STREAM_KEY secret is empty!"
            exit 1
          fi
          timeout 18900 ffmpeg -re -stream_loop -1 -i loop.mp4 \
            -c:v copy -c:a copy -f flv \
            "rtmp://a.rtmp.youtube.com/live2/${YT_STREAM_KEY}" || [ $? -eq 124 ]
            
